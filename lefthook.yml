pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{js,ts,cjs,mjs,d.ts,json,jsonc}"
      run: npx @biomejs/biome check --write {staged_files}
      stage_fixed: true
    svelte-check:
      run: npx svelte-check --tsconfig ./tsconfig.json
    vitest-run:
      run: npx vitest run
