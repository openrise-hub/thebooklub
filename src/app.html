<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Anti-theme-flash synchronous bootstrap
			(function () {
				try {
					var storedTheme = localStorage.getItem('thebooklub_theme');
					if (storedTheme === 'midnight' || storedTheme === 'bookshelf' || storedTheme === 'classic') {
						document.documentElement.setAttribute('data-theme', storedTheme);
					} else {
						document.documentElement.setAttribute('data-theme', 'classic');
					}
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'classic');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
